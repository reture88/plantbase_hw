services:
  db:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantbase
      POSTGRES_PASSWORD: plantbase
      POSTGRES_DB: plantbase
    ports:
      - '5434:5432'
    volumes:
      - plantbase_pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plantbase -d plantbase']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plantbase_pgdata:
